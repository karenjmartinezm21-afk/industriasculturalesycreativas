<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio ICC · Industrias Culturales y Creativas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#0e0d0c;--surface:#171513;--mat:#1d1a17;--ink:#efe9de;--muted:#a0968a;--line:#2b2723;--accent:#c9a46a}
.light{--bg:#f3eee5;--surface:#fbf8f2;--mat:#e9e2d3;--ink:#1c1915;--muted:#6d6459;--line:#d9cfbd}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.65;transition:background .5s,color .5s;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:100}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:.85rem;transition:all .3s}
.ib:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.ib.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.8rem}
.mark{width:34px;height:34px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.9rem}
.brand b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;line-height:1}
.brand small{font-size:.68rem;color:var(--muted);letter-spacing:.04em}
.hr{display:flex;align-items:center;gap:1rem}
.badge{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

.hero{position:relative;min-height:calc(100vh - 64px);min-height:calc(100svh - 64px);display:grid;place-items:center;text-align:center;overflow:hidden;padding:2rem 1.5rem}
.hero::before{content:"";position:absolute;inset:1.4rem;border:1px solid var(--line);pointer-events:none}
.spot{position:absolute;inset:0;background:radial-gradient(520px circle at var(--mx,50%) var(--my,42%),color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%);transition:background .25s}
.hero h2{position:relative;font-size:clamp(3.4rem,11.5vw,9.5rem);line-height:.95}
.w{display:inline-block;white-space:nowrap;margin:0 .12em}
.ch{display:inline-block;opacity:0;transform:translateY(46px);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*45ms + 250ms)}
em .ch{font-style:italic;color:var(--accent)}
@keyframes rise{to{opacity:1;transform:none}}
.hero p{position:relative;margin-top:1.6rem;font-size:1.05rem;letter-spacing:.04em;opacity:0;animation:rise 1s 1.4s forwards}
.cue{position:relative;display:inline-block;margin-top:3rem;color:var(--accent);opacity:0;animation:rise 1s 1.8s forwards}
.cue i{animation:bob 1.8s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(8px)}}

.tools{position:sticky;top:64px;z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;padding-top:.7rem;padding-bottom:.7rem}
.search{position:relative;flex:1 1 250px;max-width:340px}
.search i{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem}
.search input{width:100%;padding:.55rem 0 .55rem 1.6rem;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:.85rem;outline:none;transition:border-color .3s}
.search input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:1.6rem;flex:2 1 400px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex-shrink:0;background:none;border:0;color:var(--muted);font:inherit;font-size:.8rem;letter-spacing:.04em;padding:.5rem 0;cursor:pointer;transition:color .3s}
.tab sup{font-size:.62rem;margin-left:.2rem;opacity:.7}
.tab::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.tab:hover,.tab.active{color:var(--ink)}
.tab:hover::after,.tab.active::after{transform:scaleX(1)}
.views{display:flex;gap:.5rem;margin-left:auto}

main{padding:1rem 0 5rem}
.frame{position:relative;background:var(--mat);border:1px solid var(--line);padding:1.4rem;aspect-ratio:4/3;overflow:hidden;box-shadow:0 30px 60px -34px rgba(0,0,0,.75);clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1),transform .6s cubic-bezier(.2,.8,.2,1),border-color .4s}
.in .frame{clip-path:inset(0)}
.frame img{width:100%;height:100%;object-fit:contain;will-change:transform}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(.25s + var(--d,0)*90ms)}
.in .rv{opacity:1;transform:none}
.cat{display:flex;align-items:center;gap:.8rem;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
.cat::before{content:"";width:2rem;height:1px;background:currentColor;transition:width .5s}
.go{display:inline-flex;align-items:center;gap:.6rem;font-size:.8rem;letter-spacing:.05em;color:var(--ink);border-bottom:1px solid var(--c);padding-bottom:.25rem;transition:gap .4s,color .3s}

/* Exposición (lista) */
#grid.list .row{display:grid;grid-template-columns:1.15fr 1fr;gap:4.5rem;align-items:center;padding:3.5rem 0;border-bottom:1px solid var(--line);cursor:pointer}
#grid.list .row.alt .frame{order:2}
#grid.list .txt{display:flex;flex-direction:column;gap:1.3rem;align-items:flex-start}
#grid.list h3{font-size:clamp(2.2rem,4.4vw,3.8rem);transition:color .4s}
#grid.list .txt p{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#grid.list .row:hover h3{color:var(--c)}
#grid.list .row:hover .frame,#grid.list .row:focus-visible .frame{border-color:var(--c);transform:translateY(-6px)}
.row:hover .go{gap:1rem;color:var(--c)}
/* Galería */
#grid.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:3rem 2rem;padding-top:3rem}
#grid.gallery .row:nth-child(even){margin-top:3rem}
#grid.gallery .row{cursor:pointer}
#grid.gallery .txt{padding-top:1.1rem;display:flex;flex-direction:column;gap:.55rem}
#grid.gallery h3{font-size:1.9rem;transition:color .4s}
#grid.gallery .txt p{display:none}
#grid.gallery .go{align-self:flex-start;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s,gap .4s}
#grid.gallery .row:hover .go,#grid.gallery .row:focus-visible .go{opacity:1;transform:none}
#grid.gallery .row:hover .frame,#grid.gallery .row:focus-visible .frame{border-color:var(--c);transform:translateY(-6px)}
#grid.gallery .row:hover h3{color:var(--c)}
.empty{display:none;text-align:center;padding:5rem 0}
.empty i{font-size:2.4rem;margin-bottom:1rem}
@media(max-width:820px){#grid.list .row{grid-template-columns:1fr;gap:1.6rem;padding:2.5rem 0}#grid.list .row.alt .frame{order:0}.badge{display:none}.views{margin-left:0}#grid.gallery .row:nth-child(even){margin-top:0}#grid.gallery{grid-template-columns:repeat(2,1fr);gap:2rem 1fr}#grid.gallery h3{font-size:1.4rem}.frame{padding:.8rem}}

/* Detalle */
#detail{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;grid-template-columns:1.05fr 1fr;opacity:0;visibility:hidden;transform:scale(1.015);transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
#detail.open{opacity:1;visibility:visible;transform:none;transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1)}
.dm{position:relative;background:var(--mat);display:grid;place-items:center;padding:3.5rem;overflow:hidden}
.dm img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);transition:transform .3s ease-out}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .6s}
.db{padding:5rem 4rem 3rem;overflow-y:auto}
.db h3{font-size:clamp(2.6rem,5vw,4.6rem);margin:1.1rem 0 1.4rem}
.rule{width:64px;height:2px;background:var(--accent);margin-bottom:1.8rem}
.lbl{display:block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.db p{font-size:.95rem;color:var(--muted);max-width:60ch}
.db .team{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--ink)}
.db section{margin-bottom:2rem}
.drv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1)}
#detail.open .drv{opacity:1;transform:none;transition-delay:calc(.3s + var(--d)*90ms)}
.links{display:flex;flex-wrap:wrap;gap:.8rem}
.link{display:inline-flex;align-items:center;gap:.6rem;padding:.75rem 1.4rem;border:1px solid var(--accent);color:var(--accent);font-size:.8rem;letter-spacing:.05em;text-decoration:none;transition:all .3s}
.link:hover{background:var(--accent);color:var(--bg);transform:translateY(-3px)}
.pbar{position:absolute;top:1.2rem;right:1.2rem;z-index:5;display:flex;gap:.5rem}
.pbar .ib{background:var(--bg)}
.pbar .ib:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
@media(max-width:900px){#detail{grid-template-columns:1fr;grid-template-rows:38vh 1fr}.dm{padding:1.4rem}.db{padding:2rem 1.5rem 3rem}}
footer{border-top:1px solid var(--line);padding:2rem 0;text-align:center;font-size:.75rem;color:var(--muted);letter-spacing:.04em}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="bar"></div>
<header><div class="wrap">
  <div class="brand"><div class="mark"><i class="fa-solid fa-palette"></i></div><div><b>Portafolio ICC</b><small>Industrias Culturales y Creativas</small></div></div>
  <div class="hr"><span class="badge" id="badge"></span><button id="theme" class="ib" aria-label="Cambiar tema"></button></div>
</div></header>

<section class="hero" id="hero">
  <div class="spot"></div>
  <div>
    <h2 id="kt" aria-label="Cultura en movimiento"></h2>
    <p class="muted">Un espacio para descubrir, crear e inspirar.</p>
    <a href="#work" class="cue" aria-label="Ir a los proyectos"><i class="fa-solid fa-arrow-down"></i></a>
  </div>
</section>

<div class="tools"><div class="wrap">
  <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="text" placeholder="Buscar por título, palabra clave, autor..." aria-label="Buscar"></label>
  <div class="tabs" id="tabs"></div>
  <div class="views">
    <button class="ib on" data-view="list" aria-label="Vista de lista"><i class="fa-solid fa-list"></i></button>
    <button class="ib" data-view="gallery" aria-label="Vista de galería"><i class="fa-solid fa-table-cells-large"></i></button>
  </div>
</div></div>

<main id="work"><div class="wrap">
  <div id="grid" class="list"></div>
  <div class="empty muted" id="empty"><i class="fa-solid fa-folder-open"></i><p>No se encontraron proyectos con ese criterio de búsqueda.</p></div>
</div></main>

<div id="detail" role="dialog" aria-modal="true" aria-label="Detalle del proyecto">
  <div class="pbar">
    <button class="ib" id="prev" aria-label="Proyecto anterior"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="ib" id="next" aria-label="Proyecto siguiente"><i class="fa-solid fa-chevron-right"></i></button>
    <button class="ib" id="close" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="dm" id="dm"><img id="mImg" src="" alt=""><div class="prog" id="mProg"></div></div>
  <div class="db" id="db">
    <span class="cat drv" id="mCat" style="--c:var(--accent);--d:0"></span>
    <h3 class="drv" id="mTitle" style="--d:1"></h3>
    <div class="rule drv" style="--d:2"></div>
    <section class="drv" style="--d:3"><span class="lbl">Descripción del Proyecto</span><p id="mDesc"></p></section>
    <section class="drv" style="--d:4"><span class="lbl">Integrantes / Autores</span><p class="team" id="mTeam"></p></section>
    <div class="links drv" id="mLinks" style="--d:5"></div>
  </div>
</div>

<footer>© Portafolio Académico de Industrias Culturales y Creativas (ICC)</footer>

<script>
const projects=[
{id:'musica-viva',title:'¡Que la música viva!',category:'editorial',label:'Artes & Editorial',image:'img/¡QUÉ LA MÚSICA VIVA!.jpeg',
description:'Este proyecto consiste en una propuesta académico-pedagógica desarrollada en la clase de Industrias Culturales y Creativas que integra un libro interactivo con animación stop-motion con el propósito fundamental de preservar, salvaguardar y difundir el patrimonio musical tradicional de Colombia mediante narrativas ilustradas y exploración sonora. Teóricamente, se clasifica dentro del Campo de las Artes Centrales (Artes Visuales y Patrimonio), articulándose con el Círculo 1 de las Industrias Culturales (Libros, Cine y Video) y con el Círculo 2 de las Industrias Creativas (sector Diseño de interfaces interactivas).',
team:'Ashley Yareni Martinez Florez',links:[{label:'Visitar Sitio Web',url:'https://ashleyotakuuwu-del.github.io/viva-la-musica/',icon:'fa-solid fa-globe'}]},
{id:'bogota-ancestral',title:'Bogotá Ancestral',category:'games',label:'Videojuegos',image:'img/Bogotá ancestral.jpeg',
description:'Esta iniciativa plantea un videojuego interactivo en formato 8-bit concebido como un medio de apropiación territorial que invita a la ciudadanía a redescubrir Bogotá desde la perspectiva histórica y cosmológica de sus comunidades indígenas, visibilizando memorias ausentes en los mapas oficiales. Analíticamente, el proyecto se sitúa en el Círculo de las Artes y el Patrimonio como un contenido digital lúdico, promoviendo la diversidad cultural mediante lenguajes tecnológicos contemporáneos.',
team:'Daniela Leguizamón, Vanessa Sandoval, Daniel Vega',links:[{label:'Sitio Interactivo',url:'https://kite-filled-64751008.figma.site/',icon:'fa-solid fa-globe'}]},
{id:'compostot',title:'Compostot',category:'apps',label:'Diseño & TIC',image:'img/compostot.jpeg',
description:'El proyecto consiste en un sistema integral de gestión ecológica para parques y conjuntos residenciales enfocado en la economía circular, transformando los residuos orgánicos caninos en abono mediante estaciones inteligentes con sensores IoT, códigos QR y empaques compostables. Bajo el modelo KEA y las ICC, se desarrolla desde el Diseño de Servicio, ubicándose en el Círculo 2 (Industrias Creativas - Diseño) y apoyándose en el Círculo 3 (Industrias Relacionadas - TIC).',
team:'Valentina Rodríguez, Jonathan Ovalle, Alejandro Martín, Yhorman Pinillo',links:[{label:'Página Web Oficial',url:'https://compostot.netlify.app',icon:'fa-solid fa-globe'}]},
{id:'desintoxicados',title:'Desintoxicados',category:'editorial',label:'Prensa & Podcast',image:'img/Desintoxicados.jpeg',
description:'Esta propuesta se define como un medio de comunicación digital independiente orientado a la comunidad estudiantil secundaria, utilizando herramientas de periodismo contemporáneo, storytelling audiovisual y podcasts para visibilizar dinámicas y problemáticas del entorno escolar. Dentro de las ICC, pertenece al Círculo 1 de las Industrias Culturales (Sector Libros y Prensa / Subsector Prensa) al enfocar su actividad en la difusión de contenido informativo digital.',
team:'Laura Suan, Dilan López, Carolina Benavides',links:[{label:'Visitar Portal Web',url:'https://desintoxicados.site/',icon:'fa-solid fa-newspaper'}]},
{id:'el-arte-de-la-region',title:'El Arte de la Región',category:'branding',label:'Artesanía & Diseño',image:'img/El arte de la región.jpeg',
description:'Esta propuesta consiste en una iniciativa cultural y creativa orientada a visibilizar el talento de artistas colombianos mediante la transformación de sus expresiones culturales en objetos cotidianos de diseño, dedicando su primera edición a Bogotá. Su propósito es conectar a las personas con el arte y la identidad territorial, generando mayor reconocimiento para los creadores y acercando sus obras a nuevos públicos. Analíticamente, se enmarca en las Industrias Culturales y Creativas al integrar arte, creatividad y diseño funcional, clasificándose dentro del Campo de las Artes Centrales (subsector Artesanía).',
team:'Nicol Mariana Cepeda, Laura Sofia Vásquez',links:[{label:'Visitar Sitio Web',url:'https://www.arte-de-la-region.com',icon:'fa-solid fa-globe'}]},
{id:'historias-barrio',title:'Historias de Barrio',category:'branding',label:'Fotografía & Memoria',image:'img/Historias de barrio.jpeg',
description:'Este proyecto consiste en una propuesta de comunicación visual que busca visibilizar las memorias, identidades y expresiones culturales de los barrios populares de Bogotá (iniciando en Los Laches) mediante fotografía e ilustración, contraponiéndose a los imaginarios urbanos negativos. En el marco de las ICC, se sitúa en el Círculo de Creación (Artes Visuales, Fotografía y Diseño), transformando historias locales en contenidos de valor cultural.',
team:'Luisa Penagos',links:[{label:'Visitar Sitio Web',url:'https://acos71537-stack.github.io/historiasdebarrio/#inicio',icon:'fa-solid fa-globe'}]},
{id:'origenes',title:'Orígenes',category:'apps',label:'App & Patrimonio',image:'img/Orígenes.jpeg',
description:'Esta iniciativa plantea una plataforma tecnológica interactiva orientada a la valorización, preservación y comercialización de la cerámica artesanal colombiana, conectando el saber de los artesanos con los consumidores digitales para dinamizar la economía local. Desde el punto de vista analítico, se clasifica en el Círculo 1 de las Artes Creativas y el Patrimonio por los oficios tradicionales, y en el Círculo 3 de las Industrias Culturales Más Amplias al incorporar herramientas digitales.',
team:'Daniel Galindo, Karen Martínez',links:[{label:'Prototipo Figma',url:'https://www.figma.com/design/oLpqJ5RYZWcq4ZYZD9WnSB/splash-screen-and-onboarding-screen--Community-?node-id=0-1&m=dev&t=WnvhAnPkPA2Z146E-1',icon:'fa-brands fa-figma'},{label:'Sitio Netlify',url:'https://origenesdelaceramica.netlify.app',icon:'fa-solid fa-globe'}]},
{id:'raices',title:'RAÍCES - Memoria de barrio',category:'branding',label:'Web & Archivo Digital',image:'img/RAÍCES - memoria de barrio.jpeg',
description:'El proyecto consiste en un archivo visual y plataforma web interactiva diseñada para la recuperación, archivo y divulgación de la memoria histórica local, recopilando relatos, registros fotográficos y material audiovisual que afianzan la identidad barrial. Teóricamente, se enmarca dentro de las Industrias Culturales y de Contenido, aplicando la mediación tecnológica para la conservación del patrimonio inmaterial comunitario.',
team:'Gabriel Pachon',links:[{label:'Visitar Sitio Framer',url:'https://unreal-phone-491381.framer.app/',icon:'fa-solid fa-globe'}]},
{id:'raiz-laboratorio',title:'RAÍZ - Laboratorio Patrimonial',category:'branding',label:'Branding & Identidad',image:'img/RAÍZ.jpeg',
description:'Esta propuesta plantea una agencia especializada en la creación de marcas patrimoniales para artesanos colombianos, estructurando un modelo de negocio que dota de identidad corporativa, narrativa cultural, empaque especializado y comercio electrónico a los oficios tradicionales. Clasificatoriamente abarca el Círculo 1 (Documentación cultural), el Círculo 2 (Diseño, branding y empaque como núcleo) y el Círculo 3 (Infraestructura de comercio digital).',
team:'Juan Zambrano, Johan Penagos, Jennifer Gonzalez',links:[{label:'Visitar Sitio Web',url:'https://jdzambranom12.github.io/Raiz_Patrimonial/',icon:'fa-solid fa-globe'}]}
];
const cats={all:{n:'Todos',c:'#c9a46a'},apps:{n:'Plataformas / Apps',c:'#4aa3a8'},editorial:{n:'Editorial & Prensa',c:'#d49a3c'},games:{n:'Videojuegos',c:'#9b88ea'},branding:{n:'Branding & Memoria',c:'#d9654a'}};
const FALLBACK='https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=600';
const $=id=>document.getElementById(id),root=document.documentElement;
const esc=s=>s.replace(/"/g,'&quot;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cat='all',query='',view='list',list=[],cur=null;

/* Tema (oscuro por defecto) */
try{if(localStorage.getItem('icc-theme')==='light')root.classList.add('light')}catch(e){}
const syncTheme=()=>$('theme').innerHTML='<i class="fa-solid '+(root.classList.contains('light')?'fa-moon':'fa-sun')+'"></i>';
syncTheme();
$('theme').onclick=()=>{root.classList.toggle('light');syncTheme();try{localStorage.setItem('icc-theme',root.classList.contains('light')?'light':'dark')}catch(e){}};
const setAccent=c=>root.style.setProperty('--accent',c);

/* Título animado */
let i0=0;
$('kt').innerHTML=[['Cultura'],['en'],['movimiento',1]].map(([t,em])=>{
  const h=[...t].map(ch=>`<span class="ch" style="--i:${i0++}">${ch}</span>`).join('');
  return `<span class="w" aria-hidden="true">${em?'<em>'+h+'</em>':h}</span>`}).join(' ');

/* Foco de luz que sigue al cursor en la portada */
const hero=$('hero');
if(!reduce)hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--mx',(e.clientX-r.left)+'px');hero.style.setProperty('--my',(e.clientY-r.top)+'px')});

/* Filtros */
$('tabs').innerHTML=Object.entries(cats).map(([k,v])=>`<button class="tab${k==='all'?' active':''}" data-cat="${k}" style="--c:${v.c}">${v.n}<sup>${k==='all'?projects.length:projects.filter(p=>p.category===k).length}</sup></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  cat=b.dataset.cat;setAccent(cats[cat].c);render()};
$('q').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.view;render()});

/* Render */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
function render(){
  list=projects.filter(p=>(cat==='all'||p.category===cat)&&(p.title+p.description+p.team).toLowerCase().includes(query));
  const g=$('grid');g.className=view;
  $('empty').style.display=list.length?'none':'block';
  g.innerHTML=list.map((p,i)=>`<article class="row${i%2?' alt':''}" tabindex="0" role="button" data-id="${p.id}" style="--c:${cats[p.category].c}" aria-label="${esc(p.title)}">
    <div class="frame"><img src="${p.image}" alt="${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK}'"></div>
    <div class="txt"><span class="cat rv" style="--d:0">${p.label}</span><h3 class="rv" style="--d:1">${p.title}</h3><p class="rv" style="--d:2">${p.description}</p>
    <span class="go rv" style="--d:3">Ver detalle completo <i class="fa-solid fa-arrow-right"></i></span></div></article>`).join('');
  g.querySelectorAll('.row').forEach(el=>io.observe(el));
  par();
}
$('grid').onclick=e=>{const c=e.target.closest('.row');if(c)openD(c.dataset.id)};
$('grid').onkeydown=e=>{const c=e.target.closest('.row');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openD(c.dataset.id)}};

/* Detalle */
function fill(p){
  $('detail').style.setProperty('--accent',cats[p.category].c);
  $('mCat').style.setProperty('--c',cats[p.category].c);
  $('mCat').textContent=p.label;$('mTitle').textContent=p.title;
  $('mDesc').textContent=p.description;$('mTeam').textContent=p.team;
  const im=$('mImg');im.onerror=()=>{im.onerror=null;im.src=FALLBACK};im.src=p.image;im.alt=p.title;
  const l=list.length?list:projects;
  $('mProg').style.width=((l.findIndex(x=>x.id===p.id)+1)/l.length*100)+'%';
  $('mLinks').innerHTML=p.links.length?p.links.map(k=>`<a class="link" href="${k.url}" target="_blank" rel="noopener"><i class="${k.icon}"></i>${k.label}</a>`).join(''):'<span class="muted" style="font-size:.85rem;font-style:italic">Este proyecto no cuenta con enlaces externos activos.</span>';
  $('db').scrollTop=0;
}
function openD(id){cur=projects.find(p=>p.id===id);if(!cur)return;fill(cur);$('detail').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('close').focus(),400)}
function closeD(){$('detail').classList.remove('open');document.body.style.overflow='';cur=null}
function step(d){const l=list.length?list:projects;const i=l.findIndex(p=>p.id===cur.id);cur=l[(i+d+l.length)%l.length];fill(cur);
  $('detail').animate([{opacity:.3,transform:`translateX(${d*30}px)`},{opacity:1,transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'})}
$('close').onclick=closeD;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(!cur)return;if(e.key==='Escape')closeD();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
$('dm').addEventListener('pointermove',e=>{if(reduce)return;const r=e.currentTarget.getBoundingClientRect();
  $('mImg').style.transform=`translate(${-((e.clientX-r.left)/r.width-.5)*14}px,${-((e.clientY-r.top)/r.height-.5)*14}px)`});

/* Scroll: progreso y desplazamiento suave de las imágenes */
function par(){if(reduce)return;document.querySelectorAll('.frame img').forEach(im=>{
  const r=im.parentElement.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  im.style.transform=`translateY(${(-(r.top+r.height/2-innerHeight/2)/innerHeight*18).toFixed(1)}px)`})}
let tick=false;
addEventListener('scroll',()=>{
  $('bar').style.width=(scrollY/(root.scrollHeight-innerHeight)*100)+'%';
  if(!tick){tick=true;requestAnimationFrame(()=>{par();tick=false})}
},{passive:true});

$('badge').textContent=projects.length+' Proyectos';
render();
</script>
</body>
</html>
