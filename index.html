<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio ICC · Industrias Culturales y Creativas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f7f2e9;--surface:#fffdf8;--ink:#1f1b16;--muted:#6b6258;--line:#e4dccd;--accent:#b5472e;--shadow:0 18px 40px -22px rgba(60,40,20,.35)}
.dark{--bg:#14120f;--surface:#1c1916;--ink:#f3ede2;--muted:#a79d8f;--line:#2e2924;--shadow:0 18px 40px -22px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6;transition:background .4s,color .4s;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.1}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:100;transition:background .4s}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.75rem;font-family:Fraunces,serif;font-weight:700;font-size:1.1rem}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.95rem;transition:background .4s}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:400;font-size:.7rem;color:var(--muted)}
.hnav{display:flex;align-items:center;gap:1rem}
.badge{font-size:.72rem;font-weight:600;padding:.3rem .8rem;border-radius:999px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .25s,border-color .25s}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.icon-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Hero */
.hero{position:relative;padding:7rem 0 6rem;overflow:hidden;border-bottom:1px solid var(--line)}
.pattern{position:absolute;inset:-20% -10%;opacity:.5;pointer-events:none;background:
 repeating-conic-gradient(from 45deg at 50% 50%,color-mix(in srgb,var(--accent) 14%,transparent) 0 25%,transparent 0 50%) 0 0/56px 56px;
 -webkit-mask-image:radial-gradient(circle at 80% 30%,#000,transparent 65%);mask-image:radial-gradient(circle at 80% 30%,#000,transparent 65%)}
.hero .wrap{position:relative}
.hero h2{font-size:clamp(3rem,9vw,7rem);max-width:12ch;margin:0 0 1.2rem}
.hero h2 em{font-style:italic;color:var(--accent);transition:color .4s}
.hero p.lead{max-width:54ch;font-size:1.1rem}
.cta{display:inline-grid;place-items:center;margin-top:2.5rem;width:3rem;height:3rem;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:600;font-size:.88rem;text-decoration:none;transition:transform .25s,background .25s}
.cta:hover{transform:translateY(-3px);background:var(--accent)}

/* Barra de herramientas */
.tools{position:sticky;top:64px;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tools .wrap{padding-top:.8rem;padding-bottom:.8rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:360px}
.search i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.search input{width:100%;padding:.65rem 1rem .65rem 2.6rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.88rem;outline:none;transition:border-color .25s}
.search input:focus{border-color:var(--accent)}
.pills{display:flex;gap:.5rem;flex:2 1 400px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .95rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .25s}
.pill:hover{color:var(--ink);border-color:var(--accent)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.pill b{font-weight:600;font-size:.7rem;opacity:.7}
.pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.views{display:flex;gap:.5rem;margin-left:auto}

/* Proyectos */
main{padding:3rem 0 5rem}
#grid.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.4rem}
#grid.list{display:flex;flex-direction:column;gap:1rem}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;opacity:0;transform:translateY(28px);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card.in{opacity:1;transform:none}
.card:hover,.card:focus-visible{border-color:var(--c);box-shadow:var(--shadow);transform:translateY(-6px)}
.card::before{content:"";position:absolute;left:0;top:0;height:4px;width:100%;background:var(--c);z-index:2;transform:scaleX(.18);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover::before,.card:focus-visible::before{transform:scaleX(1)}
.thumb{aspect-ratio:4/3;padding:.8rem;background:color-mix(in srgb,var(--c) 9%,var(--bg))}
.thumb img{width:100%;height:100%;object-fit:contain;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .thumb img{transform:scale(1.03)}
.body{padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.tag{align-self:flex-start;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.25rem .65rem;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.body h3{font-size:1.35rem}
.body p{font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:auto;padding-top:.5rem;font-size:.8rem;font-weight:600;color:var(--c);display:flex;align-items:center;gap:.5rem}
.more i{transition:transform .3s}
.card:hover .more i{transform:translateX(5px)}
#grid.list .card{flex-direction:row;align-items:stretch}
#grid.list .card::before{width:4px;height:100%;transform:scaleY(.2);transform-origin:top}
#grid.list .card:hover::before{transform:scaleY(1)}
#grid.list .thumb{width:230px;aspect-ratio:auto;flex-shrink:0}
#grid.list .body{padding:1.4rem 1.6rem;justify-content:center}
#grid.list .body p{-webkit-line-clamp:2}
.empty{display:none;text-align:center;padding:4rem 0}
.empty i{font-size:2.5rem;margin-bottom:1rem}
@media(max-width:700px){#grid.list .card{flex-direction:column}#grid.list .thumb{width:100%;aspect-ratio:4/3}.badge{display:none}.views{margin-left:0}}

/* Detalle */
#detail{position:fixed;inset:0;z-index:80;background:rgba(15,10,5,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1.2rem;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
#detail.open{opacity:1;visibility:visible;transition:opacity .35s}
.panel{position:relative;width:min(1080px,100%);max-height:100%;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);transform:translateY(30px) scale(.97);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#detail.open .panel{transform:none}
.pmedia{position:relative;min-height:320px;padding:2rem;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.pmedia img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:8px}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .5s}
.pbody{padding:2.6rem 2.4rem;overflow-y:auto;max-height:90vh}
.pbody h3{font-size:clamp(1.9rem,3.6vw,2.9rem);margin:.9rem 0 1.1rem}
.rule{width:64px;height:4px;border-radius:4px;background:var(--accent);margin-bottom:1.4rem}
.lbl{display:block;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.pbody p{font-size:.95rem;color:var(--muted)}
.pbody .team{font-weight:600;color:var(--ink);font-size:1.05rem}
.pbody section{margin-bottom:1.6rem}
.links{display:flex;flex-wrap:wrap;gap:.7rem}
.link{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.2rem;border-radius:999px;background:var(--accent);color:#fff;font-size:.82rem;font-weight:600;text-decoration:none;transition:transform .25s,box-shadow .25s}
.link:hover{transform:translateY(-3px);box-shadow:0 12px 24px -10px var(--accent)}
.pbar{position:absolute;top:1rem;right:1rem;z-index:3;display:flex;gap:.45rem}
.pbar .icon-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:820px){.panel{grid-template-columns:1fr;overflow-y:auto}.pmedia{min-height:0;padding:1.2rem}.pmedia img{max-height:36vh}.pbody{padding:1.6rem 1.4rem 2rem;max-height:none}}

footer{border-top:1px solid var(--line);padding:2rem 0;text-align:center;font-size:.78rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="bar"></div>

<header>
  <div class="wrap">
    <div class="brand"><div class="logo"><i class="fa-solid fa-palette"></i></div><div>Portafolio ICC<small>Industrias Culturales y Creativas</small></div></div>
    <div class="hnav"><span id="badge" class="badge"></span><button id="theme" class="icon-btn" aria-label="Cambiar tema"><i class="fa-solid fa-moon"></i></button></div>
  </div>
</header>

<section class="hero" id="inicio">
  <div class="pattern" id="pattern"></div>
  <div class="wrap">
    <h2>Cultura en <em>movimiento</em></h2>
    <p class="lead muted">Un espacio para descubrir, crear e inspirar.</p>
    <a href="#proyectos" class="cta" aria-label="Ir a los proyectos"><i class="fa-solid fa-arrow-down"></i></a>
  </div>
</section>

<div class="tools" id="tools">
  <div class="wrap">
    <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="text" placeholder="Buscar por título, palabra clave o autor..." aria-label="Buscar"></label>
    <div class="pills" id="pills"></div>
    <div class="views">
      <button class="icon-btn on" data-view="gallery" aria-label="Vista de galería"><i class="fa-solid fa-table-cells-large"></i></button>
      <button class="icon-btn" data-view="list" aria-label="Vista de lista"><i class="fa-solid fa-list"></i></button>
    </div>
  </div>
</div>

<main id="proyectos">
  <div class="wrap">
    <div id="grid" class="gallery"></div>
    <div class="empty muted" id="empty"><i class="fa-solid fa-folder-open"></i><p>No se encontraron proyectos con ese criterio de búsqueda.</p></div>
  </div>
</main>

<div id="detail" role="dialog" aria-modal="true" aria-label="Detalle del proyecto">
  <div class="panel">
    <div class="pbar">
      <button class="icon-btn" id="prev" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="icon-btn" id="next" aria-label="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="icon-btn" id="close" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="pmedia"><img id="mImg" src="" alt=""><div class="prog" id="mProg"></div></div>
    <div class="pbody" id="pbody">
      <span class="tag" id="mCat" style="--c:var(--accent)"></span>
      <h3 id="mTitle"></h3><div class="rule"></div>
      <section><span class="lbl">Descripción del Proyecto</span><p id="mDesc"></p></section>
      <section><span class="lbl">Integrantes / Autores</span><p class="team" id="mTeam"></p></section>
      <div class="links" id="mLinks"></div>
    </div>
  </div>
</div>

<footer><div class="wrap">© Portafolio Académico de Industrias Culturales y Creativas (ICC)</div></footer>

<script>
const projects=[
{id:'musica-viva',title:'¡Que la música viva!',category:'editorial',label:'Artes & Editorial',image:'img/¡QUÉ LA MÚSICA VIVA!.jpeg',
description:'Este proyecto consiste en una propuesta académico-pedagógica desarrollada en la clase de Industrias Culturales y Creativas que integra un libro interactivo con animación stop-motion con el propósito fundamental de preservar, salvaguardar y difundir el patrimonio musical tradicional de Colombia mediante narrativas ilustradas y exploración sonora. Teóricamente, se clasifica dentro del Campo de las Artes Centrales (Artes Visuales y Patrimonio), articulándose con el Círculo 1 de las Industrias Culturales (Libros, Cine y Video) y con el Círculo 2 de las Industrias Creativas (sector Diseño de interfaces interactivas).',
team:'Ashley Yareni Martinez Florez',links:[{label:'Visitar Sitio Web',url:'https://ashleyotakuuwu-del.github.io/viva-la-musica/',icon:'fa-solid fa-globe'}]},
{id:'bogota-ancestral',title:'Bogotá Ancestral',category:'games',label:'Videojuegos',image:'img/bogota_ancestral.jpeg',
description:'Esta iniciativa plantea un videojuego interactivo en formato 8-bit concebido como un medio de apropiación territorial que invita a la ciudadanía a redescubrir Bogotá desde la perspectiva histórica y cosmológica de sus comunidades indígenas, visibilizando memorias ausentes en los mapas oficiales. Analíticamente, el proyecto se sitúa en el Círculo de las Artes y el Patrimonio como un contenido digital lúdico, promoviendo la diversidad cultural mediante lenguajes tecnológicos contemporáneos.',
team:'Daniela Leguizamón, Vanessa Sandoval, Daniel Vega',links:[]},
{id:'compostot',title:'Compostot',category:'apps',label:'Diseño & TIC',image:'img/compostot.jpeg',
description:'El proyecto consiste en un sistema integral de gestión ecológica para parques y conjuntos residenciales enfocado en la economía circular, transformando los residuos orgánicos caninos en abono mediante estaciones inteligentes con sensores IoT, códigos QR y empaques compostables. Bajo el modelo KEA y las ICC, se desarrolla desde el Diseño de Servicio, ubicándose en el Círculo 2 (Industrias Creativas - Diseño) y apoyándose en el Círculo 3 (Industrias Relacionadas - TIC).',
team:'Valentina Rodríguez, Jonathan Ovalle, Alejandro Martín, Yhorman Pinillo',links:[{label:'Página Web Oficial',url:'https://compostot.netlify.app',icon:'fa-solid fa-globe'}]},
{id:'desintoxicados',title:'Desintoxicados',category:'editorial',label:'Prensa & Podcast',image:'img/Desintoxicados.jpeg',
description:'Esta propuesta se define como un medio de comunicación digital independiente orientado a la comunidad estudiantil secundaria, utilizando herramientas de periodismo contemporáneo, storytelling audiovisual y podcasts para visibilizar dinámicas y problemáticas del entorno escolar. Dentro de las ICC, pertenece al Círculo 1 de las Industrias Culturales (Sector Libros y Prensa / Subsector Prensa) al enfocar su actividad en la difusión de contenido informativo digital.',
team:'Laura Suan, Dilan López, Carolina Benavides',links:[{label:'Visitar Portal Web',url:'https://desintoxicados.site/',icon:'fa-solid fa-newspaper'}]},
{id:'historias-barrio',title:'Historias de Barrio',category:'branding',label:'Fotografía & Memoria',image:'img/Historias de barrio.jpeg',
description:'Este proyecto consiste en una propuesta de comunicación visual que busca visibilizar las memorias, identidades y expresiones culturales de los barrios populares de Bogotá (iniciando en Los Laches) mediante fotografía e ilustración, contraponiéndose a los imaginarios urbanos negativos. En el marco de las ICC, se sitúa en el Círculo de Creación (Artes Visuales, Fotografía y Diseño), transformando historias locales en contenidos de valor cultural.',
team:'Luisa Penagos',links:[{label:'Visitar Sitio Web',url:'https://acos71537-stack.github.io/historiasdebarrio/#inicio',icon:'fa-solid fa-globe'}]},
{id:'origenes',title:'Orígenes',category:'apps',label:'App & Patrimonio',image:'img/Orígenes.jpeg',
description:'Esta iniciativa plantea una plataforma tecnológica interactiva orientada a la valorización, preservación y comercialización de la cerámica artesanal colombiana, conectando el saber de los artesanos con los consumidores digitales para dinamizar la economía local. Desde el punto de vista analítico, se clasifica en el Círculo 1 de las Artes Creativas y el Patrimonio por los oficios tradicionales, y en el Círculo 3 de las Industrias Culturales Más Amplias al incorporar herramientas digitales.',
team:'Daniel Galindo, Karen Martínez',links:[{label:'Prototipo Figma',url:'https://www.figma.com/design/oLpqJ5RYZWcq4ZYZD9WnSB/splash-screen-and-onboarding-screen--Community-?node-id=0-1&m=dev&t=WnvhAnPkPA2Z146E-1',icon:'fa-brands fa-figma'},{label:'Sitio Netlify',url:'https://origenesdelaceramica.netlify.app',icon:'fa-solid fa-globe'}]},
{id:'raices',title:'RAÍCES - Memoria de barrio',category:'branding',label:'Web & Archivo Digital',image:'img/RAÍCES - memoria de barrio.jpeg',
description:'El proyecto consiste en un archivo visual y plataforma web interactiva diseñada para la recuperación, archivo y divulgación de la memoria histórica local, recopilando relatos, registros fotográficos y material audiovisual que afianzan la identidad barrial. Teóricamente, se enmarca dentro de las Industrias Culturales y de Contenido, aplicando la mediación tecnológica para la conservación del patrimonio inmaterial comunitario.',
team:'Equipo Académico',links:[{label:'Visitar Sitio Framer',url:'https://unreal-phone-491381.framer.app/',icon:'fa-solid fa-globe'}]},
{id:'raiz-laboratorio',title:'RAÍZ - Laboratorio Patrimonial',category:'branding',label:'Branding & Identidad',image:'img/RAÍZ.jpeg',
description:'Esta propuesta plantea una agencia especializada en la creación de marcas patrimoniales para artesanos colombianos, estructurando un modelo de negocio que dota de identidad corporativa, narrativa cultural, empaque especializado y comercio electrónico a los oficios tradicionales. Clasificatoriamente abarca el Círculo 1 (Documentación cultural), el Círculo 2 (Diseño, branding y empaque como núcleo) y el Círculo 3 (Infraestructura de comercio digital).',
team:'Juan Zambrano, Johan Penagos, Jennifer Gonzalez',links:[]}
];
const cats={all:{name:'Todos',c:'#b5472e'},apps:{name:'Plataformas / Apps',c:'#1f6f78'},editorial:{name:'Editorial & Prensa',c:'#b7791f'},games:{name:'Videojuegos',c:'#4b3f8f'},branding:{name:'Branding & Memoria',c:'#b5472e'}};
const FALLBACK='https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=600';
const $=id=>document.getElementById(id), root=document.documentElement;
const esc=s=>s.replace(/"/g,'&quot;');
let cat='all',query='',view='gallery',list=[],cur=null;

/* Tema */
try{if(localStorage.getItem('icc-theme')==='dark')root.classList.add('dark')}catch(e){}
const syncTheme=()=>$('theme').innerHTML='<i class="fa-solid '+(root.classList.contains('dark')?'fa-sun':'fa-moon')+'"></i>';
syncTheme();
$('theme').onclick=()=>{root.classList.toggle('dark');syncTheme();try{localStorage.setItem('icc-theme',root.classList.contains('dark')?'dark':'light')}catch(e){}};

/* Acento según categoría */
const setAccent=c=>root.style.setProperty('--accent',c);

/* Filtros */
$('pills').innerHTML=Object.entries(cats).map(([k,v])=>{
  const n=k==='all'?projects.length:projects.filter(p=>p.category===k).length;
  return `<button class="pill${k==='all'?' active':''}" data-cat="${k}" style="--c:${v.c}"><i></i>${v.name} <b>${n}</b></button>`}).join('');
$('pills').onclick=e=>{const b=e.target.closest('.pill');if(!b)return;
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  cat=b.dataset.cat;setAccent(cats[cat].c);render()};
$('q').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.view;render()});

/* Render */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
function render(){
  list=projects.filter(p=>(cat==='all'||p.category===cat)&&(p.title+p.description+p.team+p.label).toLowerCase().includes(query));
  const g=$('grid');g.className=view;
  $('empty').style.display=list.length?'none':'block';
  
  g.innerHTML=list.map(p=>`<article class="card" tabindex="0" role="button" data-id="${p.id}" style="--c:${cats[p.category].c}" aria-label="${esc(p.title)}">
    <div class="thumb"><img src="${p.image}" alt="${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK}'"></div>
    <div class="body"><span class="tag">${p.label}</span><h3>${p.title}</h3><p>${p.description}</p>
    <span class="more">Ver detalle completo <i class="fa-solid fa-arrow-right"></i></span></div></article>`).join('');
  g.querySelectorAll('.card').forEach((el,i)=>{el.style.transitionDelay=(i%3)*80+'ms';io.observe(el)});
}
$('grid').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.id)};
$('grid').onkeydown=e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(c.dataset.id)}};

/* Detalle */
function fill(p){
  const col=cats[p.category].c;
  $('detail').style.setProperty('--accent',col);
  $('mCat').textContent=p.label;$('mTitle').textContent=p.title;
  $('mDesc').textContent=p.description;$('mTeam').textContent=p.team;
  const im=$('mImg');im.onerror=()=>{im.onerror=null;im.src=FALLBACK};im.src=p.image;im.alt=p.title;
  const l=list.length?list:projects;
  $('mProg').style.width=((l.findIndex(x=>x.id===p.id)+1)/l.length*100)+'%';
  $('mLinks').innerHTML=p.links.length?p.links.map(k=>`<a class="link" href="${k.url}" target="_blank" rel="noopener"><i class="${k.icon}"></i>${k.label}</a>`).join(''):'<span class="muted" style="font-size:.85rem;font-style:italic">Este proyecto no cuenta con enlaces externos activos.</span>';
  $('pbody').scrollTop=0;
}
function open(id){cur=projects.find(p=>p.id===id);if(!cur)return;fill(cur);$('detail').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('close').focus(),300)}
function close(){$('detail').classList.remove('open');document.body.style.overflow='';cur=null}
function step(d){const l=list.length?list:projects;const i=l.findIndex(p=>p.id===cur.id);cur=l[(i+d+l.length)%l.length];fill(cur);
  $('detail').querySelector('.panel').animate([{opacity:.3,transform:`translateX(${d*30}px)`},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})}
$('close').onclick=close;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('detail').onclick=e=>{if(e.target.id==='detail')close()};
document.addEventListener('keydown',e=>{if(!cur)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});

/* Scroll: barra de progreso y patrón con parallax suave */
addEventListener('scroll',()=>{
  $('bar').style.width=(scrollY/(root.scrollHeight-innerHeight)*100)+'%';
  $('pattern').style.transform=`translateY(${scrollY*.12}px)`;
},{passive:true});


$('badge').textContent=projects.length+' Proyectos';
render();
</script>
</body>
</html>
