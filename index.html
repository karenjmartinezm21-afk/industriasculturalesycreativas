<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio ICC - Industrias Culturales y Creativas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                fontFamily: { display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'], sans: ['"Instrument Sans"', 'system-ui', 'sans-serif'] },
                colors: { brand: { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d', 900:'#14532d' } }
            } }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg:#f2f5f0; --ink:#101a13; --muted:#5a6a60; --line:#d8e0d9; --glass:rgba(242,245,240,.78); --accent:#22c55e; }
        .dark { --bg:#08100b; --ink:#eef5ef; --muted:#93a69a; --line:#1f2f25; --glass:rgba(8,16,11,.78); }
        body { background:var(--bg); color:var(--ink); font-family:'Instrument Sans',system-ui,sans-serif; transition:background-color .5s; overflow-x:hidden; }
        .font-display { font-family:'Bricolage Grotesque',system-ui,sans-serif; }
        .muted { color:var(--muted); }
        .glass { background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
        :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }

        /* Cursor y vista previa flotante */
        .cursor { position:fixed; top:0; left:0; width:38px; height:38px; margin:-19px 0 0 -19px; border:2px solid var(--accent); border-radius:9999px; pointer-events:none; z-index:90; transition:width .25s, height .25s, margin .25s, background .25s; }
        .cursor.big { width:84px; height:84px; margin:-42px 0 0 -42px; background:color-mix(in srgb,var(--accent) 22%,transparent); }
        .peek { position:fixed; top:0; left:0; width:270px; height:340px; border-radius:1.25rem; overflow:hidden; pointer-events:none; z-index:45; opacity:0; box-shadow:0 30px 70px -20px rgba(0,0,0,.6); transition:opacity .25s; }
        .peek.show { opacity:1; }
        .peek img { width:100%; height:100%; object-fit:cover; }
        @media (hover:none) { .cursor, .peek { display:none; } }

        /* Hero */
        #kTitle .ch { display:inline-block; font-variation-settings:'wght' 500; will-change:transform; }
        #kTitle .w { display:inline-block; white-space:nowrap; }
        .marq .out { color:transparent; -webkit-text-stroke:1.5px var(--ink); }
        .cue i { animation:bob 1.6s ease-in-out infinite; }
        @keyframes bob { 50% { transform:translateY(8px); } }

        /* Barra de herramientas */
        .pill { display:inline-flex; align-items:center; gap:.45rem; padding:.5rem 1rem; border-radius:9999px; font-size:.78rem; font-weight:600; border:1px solid var(--line); color:var(--muted); transition:all .3s; }
        .pill:hover { color:var(--ink); border-color:var(--accent); transform:translateY(-2px); }
        .pill .count { font-size:.68rem; padding:.05rem .45rem; border-radius:9999px; background:var(--line); }
        .pill.active { background:var(--accent); border-color:var(--accent); color:#fff; }
        .pill.active .count { background:rgba(255,255,255,.25); }
        .vbtn { width:2.4rem; height:2.4rem; border-radius:9999px; border:1px solid var(--line); color:var(--muted); display:inline-flex; align-items:center; justify-content:center; transition:all .25s; }
        .vbtn.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }

        /* Vista lista */
        #projectsGrid.list .row { position:relative; display:grid; grid-template-columns:1.25fr .55fr 1fr auto; gap:1.5rem; align-items:center; padding:1.7rem 1.25rem; border-bottom:1px solid var(--line); overflow:hidden; cursor:pointer; opacity:0; transform:translateY(40px); transition:opacity .7s, transform .8s cubic-bezier(.2,.8,.2,1); }
        .row.in, .tile.in { opacity:1 !important; transform:none !important; }
        .row::before { content:""; position:absolute; inset:0; background:var(--rc); transform:scaleY(0); transform-origin:bottom; transition:transform .5s cubic-bezier(.7,0,.2,1); }
        .row:hover::before, .row:focus-visible::before { transform:scaleY(1); }
        .row > * { position:relative; transition:color .3s, transform .5s cubic-bezier(.2,.8,.2,1); }
        .row:hover > *, .row:focus-visible > * { color:#fff; }
        .rtitle { font-family:'Bricolage Grotesque',sans-serif; font-size:clamp(1.7rem,3.6vw,3rem); line-height:1.02; font-variation-settings:'wght' 400; transition:font-variation-settings .5s, transform .5s cubic-bezier(.2,.8,.2,1), color .3s; }
        .row:hover .rtitle, .row:focus-visible .rtitle { font-variation-settings:'wght' 800; transform:translateX(16px); }
        .rcat { font-size:.78rem; font-weight:600; display:inline-flex; align-items:center; gap:.5rem; }
        .rcat::before { content:""; width:.55rem; height:.55rem; border-radius:9999px; background:var(--rc); }
        .row:hover .rcat::before { background:#fff; }
        .rdesc { font-size:.82rem; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .rgo { display:inline-flex; align-items:center; gap:.6rem; font-size:.78rem; font-weight:600; white-space:nowrap; }
        .rgo i { width:2.2rem; height:2.2rem; border-radius:9999px; border:1px solid currentColor; display:inline-flex; align-items:center; justify-content:center; transition:transform .4s; }
        .row:hover .rgo i { transform:rotate(-45deg); }
        .rthumb { display:none; }
        @media (max-width:900px) {
            #projectsGrid.list .row { grid-template-columns:1fr; gap:.75rem; }
            .rthumb { display:block; width:100%; height:11rem; object-fit:cover; border-radius:1rem; }
        }

        /* Vista galería */
        #projectsGrid.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1.1rem; padding:1.5rem 0 0; }
        .tile { position:relative; aspect-ratio:4/5; border-radius:1.6rem; overflow:hidden; cursor:pointer; opacity:0; transform:translateY(50px); transition:opacity .7s, transform .8s cubic-bezier(.2,.8,.2,1); background:var(--line); }
        .tile:nth-child(even) { margin-top:2.2rem; }
        .tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .9s cubic-bezier(.2,.8,.2,1); }
        .tile:hover img { transform:scale(1.14) rotate(1.2deg); }
        .tile::after { content:""; position:absolute; inset:0; background:linear-gradient(to top, var(--rc) 0%, color-mix(in srgb,var(--rc) 25%,transparent) 45%, transparent 75%); opacity:.85; transition:opacity .4s; }
        .tile:hover::after { opacity:1; }
        .tile .tt { position:absolute; z-index:2; left:1.1rem; right:1.1rem; bottom:1.1rem; color:#fff; transform:translateY(8px); transition:transform .5s cubic-bezier(.2,.8,.2,1); }
        .tile:hover .tt { transform:none; }
        .tile .tt span { display:inline-block; font-size:.68rem; font-weight:700; padding:.2rem .6rem; border-radius:9999px; background:rgba(0,0,0,.35); backdrop-filter:blur(6px); margin-bottom:.5rem; }
        .tile .tt h3 { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:1.35rem; line-height:1.1; }
        .tile .tt small { display:block; margin-top:.6rem; font-size:.74rem; font-weight:600; opacity:0; transition:opacity .4s; }
        .tile:hover .tt small { opacity:1; }

        /* Detalle a pantalla completa */
        #detail { position:fixed; inset:0; z-index:70; background:var(--bg); clip-path:circle(0px at var(--ox,50%) var(--oy,50%)); visibility:hidden; transition:clip-path .75s cubic-bezier(.7,0,.2,1), visibility 0s .75s; }
        #detail.open { clip-path:circle(160vmax at var(--ox,50%) var(--oy,50%)); visibility:visible; transition:clip-path .9s cubic-bezier(.7,0,.2,1), visibility 0s; }
        .dgrid { height:100%; display:flex; flex-direction:column; }
        @media (min-width:1024px) { .dgrid { flex-direction:row; } .dmedia { width:46%; height:100% !important; } }
        .dmedia { position:relative; height:34vh; flex-shrink:0; overflow:hidden; background:color-mix(in srgb,var(--accent) 35%,var(--bg)); }
        .dmedia img { position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover; transition:transform .25s ease-out; }
        .dmedia::after { content:""; position:absolute; inset:0; background:linear-gradient(to top, color-mix(in srgb,var(--accent) 60%,transparent), transparent 55%); }
        .dbody { flex:1; overflow-y:auto; padding:2.5rem 1.5rem 3rem; }
        @media (min-width:1024px) { .dbody { padding:5rem 4rem 3rem; } }
        .rv { opacity:0; transform:translateY(30px); transition:opacity .6s, transform .8s cubic-bezier(.2,.8,.2,1); }
        #detail.open .rv { opacity:1; transform:none; transition-delay:calc(.5s + var(--d) * 110ms); }
        .dbar { position:absolute; z-index:5; top:1rem; right:1rem; display:flex; gap:.5rem; }
        .dbar button { width:2.8rem; height:2.8rem; border-radius:9999px; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; transition:transform .25s, background .25s; }
        .dbar button:hover { transform:scale(1.12); background:var(--accent); color:#fff; }
        .link-btn { display:inline-flex; align-items:center; gap:.55rem; padding:.7rem 1.2rem; border-radius:9999px; font-size:.82rem; font-weight:600; color:#fff; background:var(--accent); transition:transform .25s, box-shadow .25s; }
        .link-btn:hover { transform:translateY(-3px); box-shadow:0 14px 28px -10px var(--accent); }
        .noresults-hide { display:none; }
        @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="scrollbar" class="fixed top-0 left-0 h-[3px] z-[95]" style="background:var(--accent); width:0"></div>
    <div class="cursor" id="cursor"></div>
    <div class="peek" id="peek"><img id="peekImg" src="" alt=""></div>

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-40 glass border-b" style="border-color:var(--line)">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="text-white p-2 rounded-xl shadow-md w-10 h-10 flex items-center justify-center" style="background:var(--accent)">
                    <i class="fa-solid fa-palette text-xl"></i>
                </div>
                <div>
                    <h1 class="font-display font-bold text-lg leading-tight">Portafolio ICC</h1>
                    <p class="text-xs muted">Industrias Culturales y Creativas</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="totalBadge" class="text-xs font-semibold px-3 py-1 rounded-full hidden sm:inline-block" style="background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent)">8 Proyectos</span>
                <button id="themeToggle" aria-label="Cambiar tema" class="vbtn" data-cur>
                    <i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section id="hero" class="relative flex items-center justify-center overflow-hidden px-4" style="min-height:calc(100vh - 4rem)">
        <canvas id="fx" class="absolute inset-0 w-full h-full"></canvas>
        <div class="relative text-center max-w-6xl mx-auto space-y-6">
            <h2 id="kTitle" class="font-display font-extrabold tracking-tight leading-[.95] text-[clamp(3.2rem,12vw,10rem)]" aria-label="Cultura en movimiento"></h2>
            <p class="muted text-base sm:text-xl max-w-2xl mx-auto">Un espacio para descubrir, crear e inspirar.</p>
            <a href="#work" class="cue inline-flex flex-col items-center gap-1 pt-6 muted text-xs" data-cur aria-label="Ir a los proyectos"><i class="fa-solid fa-arrow-down text-xl" style="color:var(--accent)"></i></a>
        </div>
    </section>

    <!-- CINTA DE PROYECTOS -->
    <div class="marq overflow-hidden border-y py-4" style="border-color:var(--line)" aria-hidden="true">
        <div id="mTrack" class="flex whitespace-nowrap w-max items-center font-display text-3xl sm:text-5xl font-extrabold"></div>
    </div>

    <!-- PROYECTOS -->
    <main id="work" class="flex-grow w-full">
        <div class="sticky top-16 z-30 glass border-b" style="border-color:var(--line)">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col lg:flex-row gap-3 lg:items-center">
                <div class="relative lg:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 muted"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por título, palabra clave, autor..." class="w-full pl-11 pr-4 py-2.5 rounded-full text-sm outline-none border bg-transparent focus:border-[color:var(--accent)] transition" style="border-color:var(--line); color:var(--ink)">
                </div>
                <div class="flex flex-wrap gap-2 flex-1" id="categoryFilters">
                    <button data-cat="all" class="filter-btn pill active" data-cur>Todos <span class="count"></span></button>
                    <button data-cat="apps" class="filter-btn pill" data-cur>Plataformas / Apps <span class="count"></span></button>
                    <button data-cat="editorial" class="filter-btn pill" data-cur>Editorial &amp; Prensa <span class="count"></span></button>
                    <button data-cat="games" class="filter-btn pill" data-cur>Videojuegos <span class="count"></span></button>
                    <button data-cat="branding" class="filter-btn pill" data-cur>Branding &amp; Memoria <span class="count"></span></button>
                </div>
                <div class="flex gap-2">
                    <button class="vbtn active" data-view="list" aria-label="Vista de lista" data-cur><i class="fa-solid fa-list"></i></button>
                    <button class="vbtn" data-view="gallery" aria-label="Vista de galería" data-cur><i class="fa-solid fa-table-cells-large"></i></button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div id="projectsGrid" class="list"></div>
            <div id="noResults" class="hidden text-center py-16 space-y-3">
                <i class="fa-solid fa-folder-open text-4xl muted"></i>
                <p class="muted font-medium">No se encontraron proyectos con ese criterio de búsqueda.</p>
            </div>
        </div>
    </main>

    <!-- DETALLE -->
    <div id="detail" role="dialog" aria-modal="true" aria-label="Detalle del proyecto">
        <div class="dbar glass rounded-full p-1">
            <button id="prevProject" aria-label="Proyecto anterior" data-cur><i class="fa-solid fa-chevron-left"></i></button>
            <button id="nextProject" aria-label="Proyecto siguiente" data-cur><i class="fa-solid fa-chevron-right"></i></button>
            <button id="closeModal" aria-label="Cerrar" data-cur><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="dgrid" id="dgrid">
            <div class="dmedia" id="dmedia">
                <img id="modalImage" src="" alt="">
                <div class="absolute z-[2] left-5 bottom-5">
                    <span id="modalCategory" class="px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider text-white bg-black/40 backdrop-blur"></span>
                </div>
                <div class="absolute z-[2] left-0 bottom-0 h-1 bg-white/90 transition-all duration-500" id="modalProgress"></div>
            </div>
            <div class="dbody" id="modalBody">
                <div class="max-w-2xl space-y-7">
                    <h3 id="modalTitle" class="rv font-display font-extrabold leading-[1.02] text-[clamp(2.3rem,5.5vw,4.6rem)]" style="--d:0"></h3>
                    <div class="rv h-1.5 w-24 rounded-full" style="--d:1; background:var(--accent)"></div>
                    <div class="rv space-y-2" style="--d:2">
                        <h4 class="text-xs font-semibold muted uppercase tracking-wider">Descripción del Proyecto</h4>
                        <p id="modalDescription" class="muted text-base leading-relaxed"></p>
                    </div>
                    <div id="modalTeamContainer" class="rv" style="--d:3">
                        <span class="text-xs font-semibold muted uppercase tracking-wider block mb-1">Integrantes / Autores</span>
                        <p id="modalTeam" class="text-lg font-semibold"></p>
                    </div>
                    <div class="rv flex flex-wrap gap-3 pt-2" id="modalLinks" style="--d:4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t py-8 text-center text-xs muted" style="border-color:var(--line)">
        <p>© Portafolio Académico de Industrias Culturales y Creativas (ICC)</p>
    </footer>

                categoryLabel: 'Web & Archivo Digital',
                image: 'img/RAÍCES - memoria de barrio.jpeg',
                description: 'El proyecto consiste en un archivo visual y plataforma web interactiva diseñada para la recuperación, archivo y divulgación de la memoria histórica local, recopilando relatos, registros fotográficos y material audiovisual que afianzan la identidad barrial. Teóricamente, se enmarca dentro de las Industrias Culturales y de Contenido, aplicando la mediación tecnológica para la conservación del patrimonio inmaterial comunitario.',
                team: 'Equipo Académico',
                links: [
                    { label: 'Visitar Sitio Framer', url: 'https://unreal-phone-491381.framer.app/', icon: 'fa-globe' }
                ]
            },
            {
                id: 'raiz-laboratorio',
                title: 'RAÍZ - Laboratorio Patrimonial',
                category: 'branding',
                categoryLabel: 'Branding & Identidad',
                image: 'img/RAÍZ.jpeg',
                description: 'Esta propuesta plantea una agencia especializada en la creación de marcas patrimoniales para artesanos colombianos, estructurando un modelo de negocio que dota de identidad corporativa, narrativa cultural, empaque especializado y comercio electrónico a los oficios tradicionales. Clasificatoriamente abarca el Círculo 1 (Documentación cultural), el Círculo 2 (Diseño, branding y empaque como núcleo) y el Círculo 3 (Infraestructura de comercio digital).',
                team: 'Juan Zambrano, Johan Penagos, Jennifer Gonzalez',
                links: []
            }
        ];

        /* ---------- Estado y utilidades ---------- */
        const colors = { apps: '#2563eb', editorial: '#d97706', games: '#7c3aed', branding: '#e11d48' };
        const FALLBACK = 'https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=500';
        const $ = (id) => document.getElementById(id);
        const grid = $('projectsGrid'), noResults = $('noResults'), detail = $('detail');
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const fine = matchMedia('(hover: hover)').matches;
        let currentCategory = 'all', searchQuery = '', view = 'list', visible = [], currentId = null;
        let accent = '#22c55e', mx = -999, my = -999, hasMouse = false;
        const esc = (s) => s.replace(/"/g, '&quot;');

        function setAccent(c) { accent = c; document.documentElement.style.setProperty('--accent', c); }

        /* ---------- Cinta ---------- */
        const track = $('mTrack');
        const seq = projectsData.map((p, i) => `<span class="${i % 2 ? 'out' : ''} px-5">${p.title}</span><span class="px-3" style="color:var(--accent)">✦</span>`).join('');
        track.innerHTML = seq + seq;
        let half = 0, mpos = 0;
        const measureMarquee = () => { half = track.scrollWidth / 2; };
        addEventListener('resize', measureMarquee); document.fonts && document.fonts.ready.then(measureMarquee); measureMarquee();

        /* ---------- Título cinético ---------- */
        const kTitle = $('kTitle');
        kTitle.innerHTML = 'Cultura en movimiento'.split(' ').map(w =>
            `<span class="w" aria-hidden="true">${[...w].map(c => `<span class="ch">${c}</span>`).join('')}</span>`).join(' ');
        const chars = [...kTitle.querySelectorAll('.ch')];

        /* ---------- Partículas ---------- */
        const hero = $('hero'), cv = $('fx'), cx = cv.getContext('2d');
        let W = 0, H = 0, P = [], heroVisible = true;
        function sizeFx() {
            const r = hero.getBoundingClientRect(), d = devicePixelRatio || 1;
            W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
            P = Array.from({ length: W < 640 ? 36 : 85 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5, r: Math.random() * 2 + 1 }));
        }
        sizeFx(); addEventListener('resize', sizeFx);
        new IntersectionObserver(([e]) => heroVisible = e.isIntersecting).observe(hero);
        const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };

        function drawFx() {
            cx.clearRect(0, 0, W, H);
            const [r, g, b] = hexRgb(accent), rect = hero.getBoundingClientRect();
            const hx = mx - rect.left, hy = my - rect.top;
            for (const p of P) {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;
                const dx = hx - p.x, dy = hy - p.y, d = Math.hypot(dx, dy);
                if (d < 200) { p.x += dx * .012 * (1 - d / 200); p.y += dy * .012 * (1 - d / 200); }
                cx.fillStyle = `rgba(${r},${g},${b},.8)`;
                cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
                if (d < 200) { cx.strokeStyle = `rgba(${r},${g},${b},${(1 - d / 200) * .7})`; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(hx, hy); cx.stroke(); }
            }
            for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
                const d = Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y);
                if (d < 120) { cx.strokeStyle = `rgba(${r},${g},${b},${(1 - d / 120) * .35})`; cx.beginPath(); cx.moveTo(P[i].x, P[i].y); cx.lineTo(P[j].x, P[j].y); cx.stroke(); }
            }
        }

        /* ---------- Cursor, vista previa y bucle principal ---------- */
        const cursor = $('cursor'), peek = $('peek'), peekImg = $('peekImg');
        let c = { x: innerWidth / 2, y: innerHeight / 2 }, pk = { x: 0, y: 0, rot: 0 }, lastY = scrollY, sv = 0;

        addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; hasMouse = true; });
        document.addEventListener('mouseover', (e) => cursor.classList.toggle('big', !!e.target.closest('[data-cur], .row, .tile')));

        function loop(t) {
            if (fine) {
                c.x += (mx - c.x) * .22; c.y += (my - c.y) * .22;
                cursor.style.transform = `translate3d(${c.x}px,${c.y}px,0)`;
                const px = mx + 36, py = my - 170, vx = px - pk.x;
                pk.x += vx * .12; pk.y += (py - pk.y) * .12; pk.rot += (Math.max(-14, Math.min(14, vx * .25)) - pk.rot) * .15;
                peek.style.transform = `translate3d(${pk.x}px,${pk.y}px,0) rotate(${pk.rot}deg)`;
            }
            if (!reduce) {
                sv += ((scrollY - lastY) - sv) * .1; lastY = scrollY;
                if (half) { mpos -= .8 + Math.abs(sv) * .35; if (mpos <= -half) mpos += half; track.style.transform = `translate3d(${mpos}px,0,0)`; }
                if (heroVisible) {
                    drawFx();
                    chars.forEach((ch, i) => {
                        const r = ch.getBoundingClientRect();
                        const d = Math.hypot(mx - (r.left + r.width / 2), my - (r.top + r.height / 2));
                        const prox = hasMouse ? Math.max(0, 1 - d / 280) : 0;
                        const wave = (Math.sin(t / 650 + i * .5) + 1) / 2;
                        ch.style.fontVariationSettings = `'wght' ${(380 + wave * 160 + prox * 260) | 0}`;
                        ch.style.transform = `translateY(${-prox * 16}px)`;
                        ch.style.color = prox > .04 ? `color-mix(in srgb, var(--accent) ${(prox * 100) | 0}%, var(--ink))` : '';
                    });
                }
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        addEventListener('scroll', () => {
            $('scrollbar').style.width = (scrollY / (document.documentElement.scrollHeight - innerHeight) * 100) + '%';
        }, { passive: true });

        /* ---------- Render de proyectos ---------- */
        const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });

        function render(data) {
            visible = data;
            grid.className = view;
            noResults.classList.toggle('hidden', data.length > 0);
            grid.innerHTML = data.map(p => view === 'list' ? `
                <div class="row" tabindex="0" role="button" data-id="${p.id}" aria-label="${esc(p.title)}">
                    <img class="rthumb" src="${p.image}" alt="${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK}'">
                    <h3 class="rtitle">${p.title}</h3>
                    <span class="rcat">${p.categoryLabel}</span>
                    <p class="rdesc muted">${p.description}</p>
                    <span class="rgo">Ver detalle completo <i class="fa-solid fa-arrow-right"></i></span>
                </div>` : `
                <div class="tile" tabindex="0" role="button" data-id="${p.id}" aria-label="${esc(p.title)}">
                    <img src="${p.image}" alt="${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK}'">
                    <div class="tt"><span>${p.categoryLabel}</span><h3>${p.title}</h3><small>Ver detalle completo <i class="fa-solid fa-arrow-right"></i></small></div>
                </div>`).join('');
            grid.querySelectorAll('[data-id]').forEach((el, i) => {
                const p = data[i];
                el.style.setProperty('--rc', colors[p.category]);
                el.style.transitionDelay = (i % 4) * 70 + 'ms';
                io.observe(el);
            });
            peek.classList.remove('show');
        }

        function filterProjects() {
            render(projectsData.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchQuery) ||
                                      p.description.toLowerCase().includes(searchQuery) ||
                                      p.team.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            }));
        }

        grid.addEventListener('click', (e) => { const el = e.target.closest('[data-id]'); if (el) openModal(el.dataset.id, e.clientX, e.clientY); });
        grid.addEventListener('keydown', (e) => {
            const el = e.target.closest('[data-id]');
            if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const r = el.getBoundingClientRect(); openModal(el.dataset.id, r.left + r.width / 2, r.top + r.height / 2); }
        });
        grid.addEventListener('mouseover', (e) => {
            const row = e.target.closest('.row');
            if (!row || !fine) return;
            peekImg.onerror = () => { peekImg.onerror = null; peekImg.src = FALLBACK; };
            peekImg.src = projectsData.find(p => p.id === row.dataset.id).image;
            peek.classList.add('show');
        });
        grid.addEventListener('mouseleave', () => peek.classList.remove('show'));

        /* ---------- Detalle ---------- */
        function fillModal(p) {
            detail.style.setProperty('--accent', colors[p.category]);
            const img = $('modalImage');
            img.onerror = () => { img.onerror = null; img.src = FALLBACK; };
            img.src = p.image; img.alt = p.title;
            $('modalTitle').textContent = p.title;
            $('modalCategory').textContent = p.categoryLabel;
            $('modalDescription').textContent = p.description;
            $('modalTeam').textContent = p.team;
            const lc = $('modalLinks'); lc.innerHTML = '';
            if (p.links && p.links.length) {
                p.links.forEach(l => {
                    const a = document.createElement('a');
                    a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; a.className = 'link-btn'; a.dataset.cur = '';
                    const icon = l.icon || 'fa-link', fam = icon === 'fa-figma' ? 'fa-brands' : 'fa-solid';
                    a.innerHTML = `<i class="${fam} ${icon}"></i> <span>${l.label}</span>`;
                    lc.appendChild(a);
                });
            } else {
                lc.innerHTML = `<span class="text-sm muted italic">Este proyecto no cuenta con enlaces externos activos.</span>`;
            }
            const list = visible.length ? visible : projectsData;
            $('modalProgress').style.width = ((list.findIndex(x => x.id === p.id) + 1) / list.length * 100) + '%';
            $('modalBody').scrollTop = 0;
        }

        function openModal(id, x, y) {
            const p = projectsData.find(q => q.id === id); if (!p) return;
            currentId = id; fillModal(p);
            detail.style.setProperty('--ox', x + 'px'); detail.style.setProperty('--oy', y + 'px');
            detail.classList.add('open'); document.body.style.overflow = 'hidden';
            peek.classList.remove('show');
            setTimeout(() => $('closeModal').focus(), 400);
        }
        function closeModal() {
            detail.classList.remove('open'); document.body.style.overflow = ''; currentId = null;
        }
        function step(dir) {
            const list = visible.length ? visible : projectsData;
            const i = list.findIndex(p => p.id === currentId);
            const next = list[(i + dir + list.length) % list.length];
            currentId = next.id; fillModal(next);
            $('dgrid').animate([{ opacity: .2, transform: `translateX(${dir * 40}px)` }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
        }
        $('closeModal').onclick = closeModal;
        $('prevProject').onclick = () => step(-1);
        $('nextProject').onclick = () => step(1);
        document.addEventListener('keydown', (e) => {
            if (!currentId) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') step(-1);
            if (e.key === 'ArrowRight') step(1);
        });
        $('dmedia').addEventListener('pointermove', (e) => {
            const r = e.currentTarget.getBoundingClientRect();
            $('modalImage').style.transform = `translate(${-((e.clientX - r.left) / r.width - .5) * 30}px, ${-((e.clientY - r.top) / r.height - .5) * 30}px)`;
        });

        /* ---------- Filtros, vista, búsqueda y tema ---------- */
        document.querySelectorAll('.filter-btn').forEach(btn => {
            const cat = btn.dataset.cat;
            btn.querySelector('.count').textContent = cat === 'all' ? projectsData.length : projectsData.filter(p => p.category === cat).length;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = cat;
                setAccent(cat === 'all' ? '#22c55e' : colors[cat]);
                filterProjects();
            });
        });
        $('totalBadge').textContent = projectsData.length + ' Proyectos';

        document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('[data-view]').forEach(x => x.classList.remove('active'));
            b.classList.add('active'); view = b.dataset.view; filterProjects();
        }));

        $('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); filterProjects(); });

        try { if (localStorage.getItem('icc-theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
        $('themeToggle').addEventListener('click', () => {
            const dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('icc-theme', dark ? 'dark' : 'light'); } catch (e) {}
        });

        render(projectsData);
    </script>
</body>
</html>
