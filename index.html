<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio ICC - Industrias Culturales y Creativas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-palette text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Portafolio ICC</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Industrias Culturales y Creativas</p>
                </div>
            </div>

            <!-- Dark Mode Toggle & Counter -->
            <div class="flex items-center space-x-4">
                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-brand-100 text-brand-800 dark:bg-brand-900/40 dark:text-brand-300 hidden sm:inline-block">
                    8 Proyectos
                </span>
                <button id="themeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-lg text-yellow-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="bg-gradient-to-b from-brand-50/50 to-transparent dark:from-gray-800/40 dark:to-transparent py-10 px-4">
        <div class="max-w-4xl mx-auto text-center space-y-4">
            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white">
                Recopilación de Proyectos Académicos
            </h2>
            <p class="text-gray-600 dark:text-gray-300 text-base sm:text-lg max-w-2xl mx-auto">
                Repositorio académico de la asignatura de Industrias Culturales y Creativas.
            </p>

            <!-- BUSCADOR Y FILTROS -->
            <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3 max-w-2xl mx-auto">
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por título, palabra clave, autor..." 
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition text-sm">
                </div>
            </div>

            <!-- Categorías -->
            <div class="flex flex-wrap justify-center gap-2 pt-2" id="categoryFilters">
                <button data-cat="all" class="filter-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold bg-brand-600 text-white shadow-sm transition">Todos</button>
                <button data-cat="apps" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition">Plataformas / Apps</button>
                <button data-cat="editorial" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition">Editorial & Prensa</button>
                <button data-cat="games" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition">Videojuegos</button>
                <button data-cat="branding" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-gray-200 text-gray-700 dark:bg-gray-800 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition">Branding & Memoria</button>
            </div>
        </div>
    </section>

    <!-- GRID DE PROYECTOS -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
        <div id="projectsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Las tarjetas se generan dinámicamente con JS -->
        </div>

        <div id="noResults" class="hidden text-center py-16 space-y-3">
            <i class="fa-solid fa-folder-open text-4xl text-gray-400"></i>
            <p class="text-gray-500 dark:text-gray-400 font-medium">No se encontraron proyectos con ese criterio de búsqueda.</p>
        </div>
    </main>

    <!-- MODAL DE DETALLE -->
    <div id="projectModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl transform transition-all max-h-[90vh] flex flex-col">
            <div class="relative h-48 sm:h-64 bg-gray-100 dark:bg-gray-900 flex-shrink-0">
                <img id="modalImage" src="" alt="" class="w-full h-full object-cover">
                <button id="closeModal" class="absolute top-3 right-3 bg-black/50 hover:bg-black/70 text-white rounded-full w-8 h-8 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="absolute bottom-3 left-3">
                    <span id="modalCategory" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-brand-600 text-white shadow"></span>
                </div>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-4 flex-grow">
                <h3 id="modalTitle" class="text-2xl font-bold text-gray-900 dark:text-white"></h3>
                
                <div class="space-y-2">
                    <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Descripción del Proyecto</h4>
                    <p id="modalDescription" class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed"></p>
                </div>

                <div id="modalTeamContainer" class="pt-2">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Integrantes / Autores</span>
                    <p id="modalTeam" class="text-sm font-medium text-gray-800 dark:text-gray-200"></p>
                </div>
            </div>

            <div class="p-4 bg-gray-50 dark:bg-gray-900/50 border-t border-gray-200 dark:border-gray-700/50 flex flex-wrap gap-2 justify-end" id="modalLinks">
                <!-- Enlaces dinámicos -->
            </div>
        </div>
    </div>

    <!--
